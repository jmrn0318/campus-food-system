<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Campus Pickup | Order ahead, skip the line</title>
    <meta name="description" content="Order from the campus canteen on your phone and pick it up when it's ready." />
    <meta name="theme-color" content="#1F1B4D" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B1%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=7" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>

    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="/">Campus Pickup / Staff</a>
        <div class="header-actions">
          <button class="header-link" id="logout-btn" type="button" hidden>Sign out</button>
        </div>
      </div>
    </header>

    <main id="staff-root" class="container" tabindex="-1">
      <p class="sub">Loading the staff board…</p>
      <noscript>This app needs JavaScript. Please turn it on in your browser.</noscript>
    </main>

    <a id="cart-bar" class="cart-bar" href="#/cart" hidden></a>

    <nav class="bottom-nav" aria-label="Main" hidden>
      <a class="nav-link" data-nav="menu" href="#/">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
        <span>Menu</span>
      </a>
      <a class="nav-link" data-nav="cart" href="#/cart">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 4h2.5l2.2 10.5a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.2" />
          <circle cx="9.5" cy="19" r="1.3" />
          <circle cx="17" cy="19" r="1.3" />
        </svg>
        <span>Cart</span>
        <span id="nav-cart-count" class="nav-badge" hidden>0</span>
      </a>
      <a class="nav-link" data-nav="orders" href="#/orders">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" />
          <path d="M9 8h6M9 12h6" />
        </svg>
        <span>My orders</span>
      </a>
      <a class="nav-link" data-nav="suggest" href="#/suggest">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
        </svg>
        <span>Suggest</span>
      </a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/js/common.js"></script>
    <script src="/js/staff.js?v=8"></script>
    <script src="/js/pwa.js"></script>
  </body>
</html>
